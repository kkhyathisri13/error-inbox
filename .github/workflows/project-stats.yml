name: Update project statistics

'on':
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-stats
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Check out the reviewed default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          package-manager-cache: false
      - name: Verify dependency lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test the updater before granting it API access
        run: npm test
      - name: Generate the complete statistics snapshot
        run: npm run stats:update
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Lint the generated file and check whitespace
        run: |
          npm run lint
          git diff --check
      - name: Open or update a statistics-only pull request
        id: stats-pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ github.token }}
          branch: automation/project-stats
          base: ${{ github.event.repository.default_branch }}
          add-paths: PROJECT_STATS.md
          delete-branch: false
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: 'docs: refresh project statistics'
          title: 'docs: refresh project statistics'
          body: |
            Updates PROJECT_STATS.md using GitHub repository metadata, paginated
            contributors, and open pull requests. Bots are excluded from ranking.
            The updater tests and repository lint ran before this PR was created.
            CI is explicitly dispatched for this branch because GITHUB_TOKEN
            changes do not automatically trigger ordinary pull_request workflows.
            Independent peer review is required. This workflow does not auto-merge.
      - name: Explicitly run CI for the bot branch
        if: steps.stats-pr.outputs.pull-request-operation == 'created' || steps.stats-pr.outputs.pull-request-operation == 'updated'
        run: gh workflow run ci.yml --ref automation/project-stats
        env:
          GH_TOKEN: ${{ github.token }}
